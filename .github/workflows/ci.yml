name: CI Pipeline

on:
  push:
    branches:
      - dev

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Requirements
        run: |
          pip install -r requirements.txt

      - name: Train Model
        run: |
          python train.py

      - name: Test Model
        run: |
          python test.py

